<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Grid E-Commerce</title>
  <link rel="stylesheet" href="grid.css">
</head>

<body>

<div class="layout">

  <!-- HEADER -->
  <header class="header">
    HEADER - SHOP ONLINE
  </header>

  <!-- HERO -->
  <section class="hero">
    HERO BANNER - SALE 50%
  </section>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Bộ lọc</h3>
    <label><input type="checkbox"> Áo</label><br>
    <label><input type="checkbox"> Quần</label><br>
    <label><input type="checkbox"> Giày</label>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <div class="product-grid">

      <div class="card">Product 1</div>
      <div class="card">Product 2</div>
      <div class="card">Product 3</div>
      <div class="card">Product 4</div>
      <div class="card">Product 5</div>
      <div class="card">Product 6</div>

    </div>

  </main>

  <!-- ADS -->
  <aside class="ads">
    ADS AREA
  </aside>

  <!-- FOOTER -->
  <footer class="footer">
    FOOTER - CONTACT INFO
  </footer>

</div>

</body>
</html>
