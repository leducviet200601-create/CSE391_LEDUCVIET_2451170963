<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Media Product Page</title>

    <style>
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

<h1>Trang giới thiệu sản phẩm</h1>


<section>

    <h2>Hình ảnh sản phẩm</h2>

    <figure>
        <img src="https://placehold.co/600x400"
             alt="Điện thoại iPhone 16 mặt trước"
             loading="lazy">
        <figcaption>iPhone 16 - Mặt trước</figcaption>
    </figure>

    <figure>
        <img src="https://placehold.co/600x400"
             alt="iPhone 16 mặt sau màu titan"
             loading="lazy">
        <figcaption>iPhone 16 - Mặt sau</figcaption>
    </figure>

    <figure>
        <img src="https://placehold.co/600x400"
             alt="iPhone 16 camera zoom chi tiết"
             loading="lazy">
        <figcaption>Camera iPhone 16</figcaption>
    </figure>

</section>


<section>

    <h2>Video giới thiệu</h2>

    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        frameborder="0"
        allowfullscreen>
    </iframe>

</section>


<section>

    <h2>Video sản phẩm</h2>

    <video controls poster="https://placehold.co/600x400">

        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">

        Trình duyệt của bạn không hỗ trợ video.
    </video>

</section>


<section>

    <h2>Âm thanh giới thiệu</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Trình duyệt không hỗ trợ audio.
    </audio>

</section>


<section>

    <h2>Logo SVG</h2>

    <svg width="100" height="100">

        <circle cx="50" cy="50" r="40" fill="blue" />

    </svg>

</section>

</body>
</html>
