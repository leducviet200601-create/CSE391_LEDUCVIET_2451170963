<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Form</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      max-width: 900px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    tfoot td {
      font-weight: bold;
    }
    fieldset {
      margin-bottom: 20px;
      padding: 15px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>🛒 Giỏ hàng của bạn</h2>

<!-- BONUS: datalist tìm sản phẩm -->
<label>Tìm sản phẩm:
  <input list="products" name="search-product" placeholder="Nhập tên sản phẩm...">
</label>

<datalist id="products">
  <option value="Áo thun basic">
  <option value="Giày sneaker">
  <option value="Tai nghe Bluetooth">
  <option value="Balo laptop">
</datalist>

<table>
  <thead>
    <tr>
      <th>STT</th>
      <th>Sản phẩm</th>
      <th>Đơn giá</th>
      <th>Số lượng</th>
      <th>Thành tiền</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>1</td>
      <td>Áo thun basic</td>
      <td>150000</td>
      <td>2</td>
      <td>300000</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Giày sneaker</td>
      <td>500000</td>
      <td>1</td>
      <td>500000</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Tai nghe Bluetooth</td>
      <td>250000</td>
      <td>1</td>
      <td>250000</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="4">Tổng cộng</td>
      <td>1,050,000</td>
    </tr>
  </tfoot>
</table>

<!-- BONUS: output tổng tiền -->
<label>
  Tổng tiền (output):
  <output name="total">1050000</output> VND
</label>

<!-- BONUS: điểm tích lũy -->
<label>Điểm tích lũy:</label>
<meter value="70" min="0" max="100">70%</meter>

<form>

  <fieldset>
    <legend>Phương thức thanh toán</legend>

    <label>
      <input type="radio" name="payment" value="cod" required>
      COD (Thanh toán khi nhận hàng)
    </label>

    <label>
      <input type="radio" name="payment" value="bank">
      Chuyển khoản
    </label>

    <label>
      <input type="radio" name="payment" value="e-wallet">
      Ví điện tử
    </label>
  </fieldset>

  <fieldset>
    <legend>Mã giảm giá</legend>
    <input
      type="text"
      name="coupon"
      placeholder="VD: SALE2026"
      pattern="SALE[0-9]{4}"
      title="Mã phải có dạng SALE + 4 chữ số (VD: SALE2026)"
    >
  </fieldset>

  <fieldset>
    <legend>Ghi chú</legend>
    <textarea name="note" rows="4" cols="50" placeholder="Ghi chú (không bắt buộc)"></textarea>
  </fieldset>

  <fieldset>
    <legend>Thông tin giao hàng</legend>

    <label>Ngày giao hàng mong muốn:</label>
    <input type="date" name="delivery_date" id="delivery_date" required>

    <label>Khung giờ:</label>
    <select name="time_slot" required>
      <option value="">-- Chọn khung giờ --</option>
      <option>Sáng 8-12h</option>
      <option>Chiều 14-18h</option>
      <option>Tối 18-21h</option>
    </select>

    <label>Thời gian giao hàng (số ngày):</label>
    <input type="range" name="delivery_days" min="1" max="7" step="1">
  </fieldset>

  <button type="submit" aria-label="Xác nhận đặt hàng">
    Xác nhận đặt hàng
  </button>

</form>

<script>
  // set min date = tomorrow
  const dateInput = document.getElementById("delivery_date");
  const today = new Date();
  today.setDate(today.getDate() + 1);
  const minDate = today.toISOString().split("T")[0];
  dateInput.min = minDate;
</script>

</body>
</html>
