<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Selectors Test</title>

<style>
/* ====== highlight để kiểm chứng ====== */
h1 {
  border: 2px solid red;
}

.price {
  background: yellow;
}

nav a:first-child {
  color: green;
  font-weight: bold;
}

.product.featured h2 {
  color: red;
}

article > p {
  border-left: 3px solid blue;
  margin-left: 10px;
}

a[href="/"] {
  text-decoration: underline;
}

.top-bar.dark h1 {
  background: pink;
}

/* layout nhẹ */
body {
  font-family: Arial;
  padding: 20px;
}
</style>

</head>

<body>

<div id="app">

    <header class="top-bar dark">
        <h1>ShopTLU</h1>

        <nav>
            <a href="/" class="active">Home</a>
            <a href="/products">Products</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main>

        <article class="product">
            <h2>iPhone 16</h2>
            <p class="price">25.990.000đ</p>
            <p>Mô tả sản phẩm iPhone...</p>
        </article>

        <article class="product featured">
            <h2>MacBook Pro</h2>
            <p class="price">45.990.000đ</p>
            <p>Mô tả sản phẩm MacBook...</p>
        </article>

    </main>

</div>

</body>
</html>
