<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Page</title>
  <link rel="stylesheet" href="responsive.css">
</head>

<body>

<header class="header">
  <div class="logo">SHOPTLU</div>

  <button class="menu-toggle">☰</button>

  <nav class="nav">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
  </nav>
</header>

<div class="layout">

  <aside class="sidebar">
    <h3>Filter</h3>
    <label><input type="checkbox"> Áo</label><br>
    <label><input type="checkbox"> Quần</label><br>
    <label><input type="checkbox"> Giày</label>
  </aside>

  <main class="main">
    <div class="grid">

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 1</h3>
        <p>100.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 2</h3>
        <p>200.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 3</h3>
        <p>300.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 4</h3>
        <p>400.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 5</h3>
        <p>500.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 6</h3>
        <p>600.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 7</h3>
        <p>700.000đ</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="">
        <h3>Product 8</h3>
        <p>800.000đ</p>
      </div>

    </div>
  </main>

  <aside class="ads">
    ADS
  </aside>

</div>

<footer class="footer">
  FOOTER
</footer>

</body>
</html>
